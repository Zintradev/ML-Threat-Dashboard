name: Docker Build Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t threat-backend -f Dockerfile.backend .

      - name: Build Frontend Image
        run: docker build -t threat-frontend -f Dockerfile.frontend .
